name: Publish to AUR

# Actualiza los paquetes 'blackwire' (app web, desde fuente) y 'blackwire-bin'
# (app de escritorio Tauri, binario del release) en el AUR cuando se publica un
# release estable, o manualmente. Requiere el secret AUR_SSH_PRIVATE_KEY (clave
# SSH registrada en tu cuenta del AUR); si no está, el job se omite sin fallar.
#
# El paquete VCS 'blackwire-git' NO se publica aquí (rastrea git; republícalo a
# mano cuando cambie su PKGBUILD).

on:
  release:
    types: [released]   # solo releases publicados y NO pre-release
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar (sin la 'v', p.ej. 1.0.0)"
        required: true

jobs:
  aur-publish:
    runs-on: ubuntu-latest
    if: ${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}
    strategy:
      fail-fast: false
      matrix:
        pkg: [blackwire, blackwire-bin]
    steps:
      - uses: actions/checkout@v6

      - name: Determinar versión
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v="${{ github.event.release.tag_name }}"; v="${v#v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Publicando ${{ matrix.pkg }} v$v"

      - name: Fijar pkgver en el PKGBUILD
        run: |
          pkg="packaging/aur/${{ matrix.pkg }}/PKGBUILD"
          sed -i "s/^pkgver=.*/pkgver=${{ steps.ver.outputs.version }}/" "$pkg"
          sed -i "s/^pkgrel=.*/pkgrel=1/" "$pkg"

      - name: Publicar en el AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4
        with:
          pkgname: ${{ matrix.pkg }}
          pkgbuild: packaging/aur/${{ matrix.pkg }}/PKGBUILD
          commit_username: glitchboi
          commit_email: glitchboi_mx@proton.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to v${{ steps.ver.outputs.version }}"
          updpkgsums: true
          test: true
