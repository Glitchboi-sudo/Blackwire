# Metadatos del proyecto y configuración de herramientas.
# Las dependencias de ejecución viven en requirements.txt (fuente única;
# se instalan con `make install`). Aquí van metadatos + config de linting/formato.

[project]
name = "blackwire"
version = "2.0.0"
description = "Proxy interceptor HTTP/HTTPS para pruebas de seguridad — alternativa ligera y extensible a Burp Suite/OWASP ZAP."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Erik Alcantara (glitchboi)" }]
keywords = ["proxy", "mitmproxy", "pentest", "security", "http", "intercept", "burp"]

[project.urls]
Homepage = "https://github.com/Glitchboi-sudo/Blackwire"
Repository = "https://github.com/Glitchboi-sudo/Blackwire"
Wiki = "https://github.com/Glitchboi-sudo/Blackwire/wiki"

[project.scripts]
# Servidor MCP por stdio; lo lanza el cliente de IA (Claude Desktop/Code).
# En desarrollo equivale a `python -m mcp_server.server`.
blackwire-mcp = "mcp_server.server:main"

[tool.ruff]
# El backend se ejecuta con cwd=backend (imports planos), por eso es la raíz de código.
src = ["backend"]
line-length = 120
target-version = "py39"
extend-exclude = ["projects", "venv", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# Las extensiones de mitmproxy usan API dinámica; no exigir type hints estrictos.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["backend"]
python_files = ["test_*.py"]
