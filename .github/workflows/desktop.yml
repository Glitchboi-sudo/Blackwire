name: Desktop build

# Construye instaladores NATIVOS de la app de escritorio (PySide6 + PyInstaller),
# lo más amplio posible por SO:
#   Linux   -> .deb, .rpm, .AppImage, .tar.gz
#   macOS   -> .dmg, .pkg
#   Windows -> .exe (Inno Setup), .msi (WiX)
# Se dispara al publicar un tag `v*` (adjunta los instaladores al release) o
# manualmente desde Actions.
#
# La MISMA imagen Docker del backend se construye una vez y se incluye, como
# tarball, dentro de cada instalador (la GUI gestiona el contenedor en runtime).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  BW_VERSION: "2.1.0"

jobs:
  # 1) Imagen Docker del backend (compartida por los 3 SO).
  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Construir imagen Docker
        run: docker build -f packaging/Dockerfile -t blackwire:latest .
      - name: Exportar imagen como tarball
        run: docker save blackwire:latest | gzip -c > blackwire-image.tar.gz
      - uses: actions/upload-artifact@v6
        with:
          name: blackwire-image
          path: blackwire-image.tar.gz
          retention-days: 1

  # 2) Instaladores nativos por SO.
  bundle:
    needs: docker-image
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: linux
          - os: macos-latest
            asset: macos
          - os: windows-latest
            asset: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar dependencias (Python)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install "PySide6>=6.11" requests websocket-client "mcp>=2.3.0" httpx pyinstaller

      - name: Descargar la imagen Docker compartida
        uses: actions/download-artifact@v8
        with:
          name: blackwire-image
          path: dist-image

      - name: Construir el ejecutable (PyInstaller)
        shell: bash
        run: pyinstaller --noconfirm packaging/blackwire-desktop.spec

      # ---------------- Linux: .deb, .rpm, .AppImage, .tar.gz ----------------
      - name: Herramientas de empaquetado (Linux)
        if: matrix.asset == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm librsvg2-bin
          sudo gem install --no-document fpm
      - name: Empaquetar Linux
        if: matrix.asset == 'linux'
        shell: bash
        run: |
          cp packaging/docker-compose.runtime.yml dist/blackwire-desktop/docker-compose.yml
          cp dist-image/blackwire-image.tar.gz dist/blackwire-desktop/blackwire-image.tar.gz
          bash packaging/build-linux.sh "${BW_VERSION}" dist/blackwire-desktop

      # ------------------------- macOS: .dmg, .pkg --------------------------
      - name: Empaquetar macOS
        if: matrix.asset == 'macos'
        shell: bash
        run: bash packaging/build-macos.sh "${BW_VERSION}"

      # ----------------------- Windows: .exe, .msi --------------------------
      # PowerShell en Windows: evita que Git-bash (MSYS) destroce los argumentos
      # tipo /D... de ISCC ("You may not specify more than one script filename").
      - name: Empaquetar Windows (.exe Inno Setup)
        if: matrix.asset == 'windows'
        shell: pwsh
        run: |
          Copy-Item packaging/docker-compose.runtime.yml dist/blackwire-desktop/docker-compose.yml
          Copy-Item dist-image/blackwire-image.tar.gz dist/blackwire-desktop/blackwire-image.tar.gz
          # Ruta ABSOLUTA: Inno resuelve Source relativo al dir del .iss (packaging/), no al cwd.
          $build = Join-Path $PWD 'dist\blackwire-desktop'
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DBuildDir=$build" "packaging\windows-installer.iss"
      - name: Empaquetar Windows (.msi WiX)
        if: matrix.asset == 'windows'
        continue-on-error: true
        shell: pwsh
        run: |
          # WiX v7 exige aceptar la EULA de la OSMF (error WIX7015) y falla en CI;
          # se fija v5.0.2 (última sin OSMF, misma sintaxis `wix build`).
          dotnet tool install --global wix --version 5.0.2
          $build = Join-Path $PWD 'dist\blackwire-desktop'
          wix build packaging\windows-installer.wxs -d "BuildDir=$build" -o "Blackwire-$env:BW_VERSION-x64.msi"

      - name: Subir instaladores como artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: blackwire-desktop-${{ matrix.asset }}
          path: |
            *.deb
            *.rpm
            *.AppImage
            *.dmg
            *.pkg
            *.msi
            blackwire-desktop-*-linux.tar.gz
            packaging/Output/*.exe
          if-no-files-found: ignore

      - name: Publicar en el release (solo en tag)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: 'Blackwire 2.1 "Buck"'
          draft: true
          files: |
            *.deb
            *.rpm
            *.AppImage
            *.dmg
            *.pkg
            *.msi
            blackwire-desktop-*-linux.tar.gz
            packaging/Output/*.exe
