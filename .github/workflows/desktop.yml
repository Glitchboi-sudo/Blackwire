name: Desktop build

# Construye la app de escritorio NATIVA (PySide6, empaquetada con PyInstaller) para
# Linux, macOS y Windows. Se dispara al publicar un tag `v*` (crea un release en
# borrador con todos los bundles) o manualmente desde la pestaña Actions.
#
# Arquitectura: la GUI nativa corre en el HOST y gestiona un contenedor Docker con
# el backend (ver desktop/blackwire_desktop/docker_runtime.py). Por eso la MISMA
# imagen Docker de Linux se construye una vez y se incluye, como tarball, junto al
# ejecutable de cada SO; la GUI la carga en el primer arranque (`docker load`).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # necesario para crear el release

jobs:
  # 1) Construye la imagen Docker del backend una vez y la comparte como artifact.
  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Construir imagen Docker
        run: docker build -f packaging/Dockerfile -t blackwire:latest .

      - name: Exportar imagen como tarball
        run: docker save blackwire:latest | gzip -c > blackwire-image.tar.gz

      - uses: actions/upload-artifact@v6
        with:
          name: blackwire-image
          path: blackwire-image.tar.gz
          retention-days: 1

  # 2) Empaqueta la GUI nativa en cada SO con PyInstaller y le adjunta el tarball.
  bundle:
    needs: docker-image
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04   # glibc antigua = mejor compatibilidad del binario
            asset: linux
          - os: macos-latest
            asset: macos
          - os: windows-latest
            asset: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Dependencias de ejecución de la GUI + MCP + el empaquetador. El backend
      # (mitmproxy/fastapi/uvicorn) NO se instala: va en la imagen Docker.
      - name: Instalar dependencias
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install "PySide6>=6.11" requests websocket-client "mcp>=2.3.0" httpx pyinstaller

      - name: Descargar la imagen Docker compartida
        uses: actions/download-artifact@v8
        with:
          name: blackwire-image
          path: dist-image

      - name: Construir el ejecutable (PyInstaller)
        shell: bash
        run: pyinstaller --noconfirm packaging/blackwire-desktop.spec

      # Coloca compose + tarball JUNTO al ejecutable: docker_runtime._resource_dir()
      # los resuelve primero via Path(sys.executable).parent.
      - name: Adjuntar compose + imagen al bundle
        shell: bash
        run: |
          cp packaging/docker-compose.runtime.yml dist/blackwire-desktop/docker-compose.yml
          cp dist-image/blackwire-image.tar.gz dist/blackwire-desktop/blackwire-image.tar.gz

      - name: Empaquetar el bundle
        shell: bash
        run: tar -C dist -czf blackwire-desktop-${{ matrix.asset }}.tar.gz blackwire-desktop

      - name: Subir bundle como artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: blackwire-desktop-${{ matrix.asset }}
          path: blackwire-desktop-${{ matrix.asset }}.tar.gz
          if-no-files-found: error

      - name: Publicar en el release (solo en tag)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: 'Blackwire ${{ github.ref_name }}'
          draft: true
          files: blackwire-desktop-${{ matrix.asset }}.tar.gz
